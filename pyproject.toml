[project]
name = "bdh"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "requests>=2.34.2",
    "torch>=2.13.0",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]
torchvision = [{ index = "pytorch-cu132" }]

